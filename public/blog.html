<style>
  :root{
    --bg:#0c0c0d; --bg-alt:#131315; --card:#1c1c1f; --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
    --text:#f3f1ea; --text-dim:#9a978d; --gold:#c9a227; --gold-light:#e4c566;
    --font-display:'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --font-body:'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --font-sans:'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --font-mono:'Nunito', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--font-body); line-height:1.6;}
  a{color:inherit; text-decoration:none;}
  .wrap{max-width:920px; margin:0 auto; padding:0 24px 80px;}
  header{border-bottom:1px solid var(--border); padding:20px 0; margin-bottom:44px;}
  .logo-link{display:block; max-width:920px; margin:0 auto; padding:0 24px;}
  .logo{font-family:var(--font-display); font-size:20px; font-weight:700; color:#fff; text-transform:uppercase;}
  .logo span{color:var(--gold);}
  .eyebrow{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--gold-light); font-weight:600; margin-bottom:12px;
  }
  h1{font-family:var(--font-display); font-size:32px; color:#fff; margin-bottom:36px;}
  .article-grid{display:flex; flex-direction:column; gap:16px;}
  .article-card{
    display:block; background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:22px 24px; transition:border-color .2s;
  }
  .article-card:hover{border-color:var(--gold);}
  .article-card h2{font-family:var(--font-display); font-size:19px; color:#fff; margin-bottom:8px;}
  .article-card p{font-size:14px; color:var(--text-dim); margin-bottom:10px;}
  .article-card .meta{font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim);}
  .empty{
    text-align:center; padding:60px 20px; color:var(--text-dim); font-size:14.5px;
    background:var(--card); border:1px solid var(--border); border-radius:12px;
  }
  footer{text-align:center; padding:24px; font-size:12px; color:var(--text-dim); border-top:1px solid var(--border); margin-top:40px;}
  .share-bar{background:var(--card); border-bottom:1px solid var(--border); padding:8px 0;}
  .share-bar .wrap{max-width:920px; padding:0 24px; display:flex; align-items:center; justify-content:center; gap:12px;}
  .share-bar__label{font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); letter-spacing:.04em;}
  .share-bar__btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:28px; height:28px; border-radius:50%; transition:transform .15s, opacity .15s; opacity:.9;
  }
  .share-bar__btn:hover{transform:translateY(-1px); opacity:1;}
  .share-bar__btn svg{width:16px; height:16px;}
</style>
</head>

<div class="wrap">

<script>
  function echapper(texte){
    const div = document.createElement('div');
    div.textContent = texte || '';
    return div.innerHTML;
  }

  fetch('/api/articles')
    .then(res => res.json())
    .then(data => {
      const grid = document.getElementById('articleGrid');
      const articles = data.articles || [];
      if(articles.length === 0){
        grid.innerHTML = '<div class="empty">Aucun article publié pour le moment — revenez bientôt.</div>';
        return;
      }
      grid.innerHTML = articles.map(a => `
        <a class="article-card" href="/article.html?slug=${encodeURIComponent(a.slug)}">
          <h2>${echapper(a.titre)}</h2>
          ${a.extrait ? `<p>${echapper(a.extrait)}</p>` : ''}
          <span class="meta">${a.published_at ? new Date(a.published_at).toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' }) : ''}</span>
        </a>
      `).join('');
    })
    .catch(() => {
      document.getElementById('articleGrid').innerHTML = '<div class="empty">Impossible de charger les articles pour le moment.</div>';
    });

  (function initPartageSocial(){
    const url = encodeURIComponent(window.location.href);
    const texte = encodeURIComponent(document.title);
    const btnWA = document.getElementById('shareWhatsApp');
    const btnFB = document.getElementById('shareFacebook');
    if(btnWA) btnWA.href = `https://wa.me/?text=${texte}%20${url}`;
    if(btnFB) btnFB.href = `https://www.facebook.com/sharer/sharer.php?u=${url}`;
  })();
</script>


<style id="bottomNavStyle">
  /* ---------- Police unique : Nunito partout (y compris boutons, champs et listes) ---------- */
  html, body{font-family:var(--font-body);}
  body{-webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility;}
  button, input, select, textarea, optgroup, option{font-family:inherit;}

  /* ---------- Barre de navigation flottante ---------- */
  .bottom-nav{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(12px + env(safe-area-inset-bottom, 0px));
    width:calc(100% - 24px); max-width:520px; z-index:997;
    display:flex; align-items:stretch; gap:2px; padding:6px;
    background:rgba(24,24,27,.82);
    -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%);
    border:1px solid var(--border-strong); border-radius:28px;
    box-shadow:0 12px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  }
  [data-theme="light"] .bottom-nav{
    background:rgba(255,255,255,.86);
    box-shadow:0 12px 32px rgba(76,29,149,.22), inset 0 1px 0 rgba(255,255,255,.9);
  }
  /* Pastille qui glisse sous l'onglet actif */
  .bottom-nav .bn-ind{
    position:absolute; left:0; top:0; width:0; height:0; border-radius:22px; pointer-events:none; opacity:0; z-index:0;
    background:rgba(201,162,39,.16);
    background:color-mix(in srgb, var(--gold) 18%, transparent);
    border:1px solid rgba(201,162,39,.38);
    border:1px solid color-mix(in srgb, var(--gold) 42%, transparent);
    box-shadow:0 0 18px rgba(201,162,39,.18);
    box-shadow:0 0 18px color-mix(in srgb, var(--gold) 22%, transparent);
  }
  .bottom-nav.ready .bn-ind{transition:transform .38s cubic-bezier(.3,.9,.3,1), width .38s cubic-bezier(.3,.9,.3,1), height .38s, opacity .2s;}
  [data-theme="light"] .bottom-nav .bn-ind{background:rgba(124,58,237,.12); border-color:rgba(124,58,237,.32); box-shadow:0 0 16px rgba(124,58,237,.16);}
  .bottom-nav .bn-item{
    position:relative; z-index:1; flex:1 1 0; min-width:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    padding:7px 2px 6px; border-radius:22px; border:1px solid transparent;
    color:var(--text-dim); text-align:center; text-decoration:none;
    -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    transition:color .25s, transform .15s;
  }
  .bottom-nav .bn-item:active{transform:scale(.93);}
  .bottom-nav .bn-item svg{
    width:22px; height:22px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round;
    transition:transform .3s cubic-bezier(.3,.9,.3,1), stroke-width .2s;
  }
  .bottom-nav .bn-item span{
    display:flex; align-items:center; justify-content:center; min-height:2.3em;
    font-family:var(--font-body); font-size:10px; font-weight:700; line-height:1.15; letter-spacing:0;
  }
  .bottom-nav .bn-item.active{color:var(--gold-light);}
  .bottom-nav .bn-item.active svg{transform:translateY(-1px) scale(1.1); stroke-width:2.1;}
  /* Sans JavaScript : l'onglet actif garde son propre fond */
  .bottom-nav:not(.ready) .bn-item.active{
    background:rgba(201,162,39,.16); background:color-mix(in srgb, var(--gold) 18%, transparent);
    border-color:rgba(201,162,39,.38);
  }
  [data-theme="light"] .bottom-nav:not(.ready) .bn-item.active{background:rgba(124,58,237,.12); border-color:rgba(124,58,237,.32);}
  @media (prefers-reduced-motion:reduce){
    .bottom-nav.ready .bn-ind, .bottom-nav .bn-item, .bottom-nav .bn-item svg{transition:none;}
  }
  @media (max-width:340px){ .bottom-nav .bn-item span{font-size:9.5px;} }
  body{padding-bottom:calc(96px + env(safe-area-inset-bottom, 0px));}

</style>

<script>
  /* Pastille animée sous l'onglet actif */
  (function(){
    var nav = document.getElementById('bottomNav'); if(!nav) return;
    var ind = document.createElement('span'); ind.className = 'bn-ind'; ind.setAttribute('aria-hidden','true');
    nav.insertBefore(ind, nav.firstChild);
    function place(){
      var a = nav.querySelector('.bn-item.active');
      if(!a){ ind.style.opacity = '0'; return; }
      ind.style.opacity = '1';
      ind.style.width = a.offsetWidth + 'px'; ind.style.height = a.offsetHeight + 'px';
      ind.style.transform = 'translate(' + a.offsetLeft + 'px,' + a.offsetTop + 'px)';
    }
    place();
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ nav.classList.add('ready'); }); });
    window.addEventListener('resize', place);
    window.addEventListener('load', place);
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(place);
    if(window.MutationObserver) new MutationObserver(place).observe(nav, {subtree:true, attributes:true, attributeFilter:['class']});
  })();
</script>
